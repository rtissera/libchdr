name: Android

on:
  # push only on master: a branch push and its pull request otherwise run
  # every job twice on the same commit. paths-ignore skips work the change
  # cannot affect - no job here builds anything
  # under contrib/, and prose does not change decoded output.
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'contrib/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'contrib/**'

# Cancel superseded runs: a force-push otherwise leaves the previous commit's
# jobs running to completion alongside the new ones. Never cancels master.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        android_abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        android_stl: [c++_shared, c++_static]

    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.android_abi }} -DANDROID_STL=${{ matrix.android_stl }}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config Release
