name: CMake

on:
  # push only on master - a branch push and its pull_request otherwise run
  # every job twice on the same commit
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs: a force-push otherwise leaves the previous commit's
# jobs running to completion alongside the new ones. Never cancels master.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-26.04-arm, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config Release

      # Known-answer tests for the hand-optimised ECC and CRC16 primitives.
      # Runs across the whole matrix so the pinned values are checked on
      # x86-64, arm64, macOS and Windows rather than one host.
      - name: Known-answer tests
        run: ctest --test-dir ${{github.workspace}}/build -C Release --output-on-failure
