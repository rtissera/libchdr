name: ESP32-P4 RAM budget

# Cross-compiles libchdr for RV32IMAFC/ilp32f (ESP32-P4's RISC-V cores share
# BL616's base ISA/ABI - see cmake/toolchain-rv32imafc.cmake) and runs the
# same peak-heap-per-codec probe as rv32-ram-budget.yml under
# qemu-system-riscv32. Byte-identical methodology and (expected) numbers to
# rv32-ram-budget.yml - this workflow exists purely so ESP32-P4 gets its own
# named CI job/budget file (matching the rp2350-arm/rp2350-riscv/rv32
# pattern), not because a different ABI needs separately measuring. See
# esp32p4-build.yml for the compile+link-only smoke test of
# contrib/esp32p4/chd/chd_esp_vfs.c against the real integration surface.
#
# Uses the same generic riscv64-unknown-elf-gcc toolchain as
# rv32-ram-budget.yml, not Espressif's own riscv32-esp-elf toolchain or
# ESP-IDF - see contrib/esp32p4/README.md for that tradeoff.
#
# Built with -Os -flto and CHDR_LOWRAM_TARGET=ON, same rationale as
# rv32-ram-budget.yml.

on: [push, pull_request]

jobs:
  esp32p4-ram-budget:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install RV32 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf qemu-system-misc mame-tools

      - name: Configure (rv32imafc/ilp32f)
        run: >
          cmake -B build-esp32p4
          -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/cmake/toolchain-rv32imafc.cmake
          -DBUILD_SHARED_LIBS=OFF -DINSTALL_STATIC_LIBS=OFF
          -DCMAKE_BUILD_TYPE=MinSizeRel -DCHDR_LOWRAM_TARGET=ON -DCHDR_WANT_TESTS=OFF

      - name: Build chdr-static
        run: cmake --build build-esp32p4 --target chdr-static -j$(nproc)

      - name: Generate corpus seeds (chdman)
        run: tests/corpus/generate.sh

      - name: Generate embedded corpus headers
        run: tests/esp32p4/gen_embed.sh

      - name: Build RAM-budget firmware
        run: |
          riscv64-unknown-elf-gcc -march=rv32imafc -mabi=ilp32f \
            --specs=picolibc.specs --crt0=semihost --oslib=semihost \
            -I include -I tests/esp32p4 -Os -flto \
            -Wl,--wrap=malloc -Wl,--wrap=free -Wl,--wrap=realloc -Wl,--wrap=calloc \
            -o tests/esp32p4/fw.elf tests/esp32p4/fw.c \
            build-esp32p4/libchdr-static.a \
            build-esp32p4/deps/lzma-26.02/libchdr-lzma.a \
            build-esp32p4/deps/zstd-1.5.7/libzstd.a \
            build-esp32p4/deps/miniz-3.1.2/libminiz.a

      - name: Run under qemu-system-riscv32 and enforce RAM budget
        run: |
          timeout 60 qemu-system-riscv32 -M virt -nographic -bios none -semihosting -m 64M \
            -kernel tests/esp32p4/fw.elf > esp32p4-ram.log 2>&1
          cat esp32p4-ram.log
          python3 tests/esp32p4/check_budget.py esp32p4-ram.log
